# visualizelaws.app — full local stack.
#   One command:  docker compose up   (or: pnpm up / pnpm up:build)
#     Full ~2.2M-row corpus:  pnpm up:full   (SEED_LIMIT=0)
#     -> Postgres (pg18) + the Next.js app (auto-migrate, seed, hot reload) on :3000
#   DB only (for host-run `pnpm dev`):  pnpm db:up  /  pnpm db:down
name: visualize-laws-app
services:
  postgres:
    # pgvector image = stock PostgreSQL 18 with the pgvector extension available
    # (dormant until `CREATE EXTENSION vector`). Debian-based, not alpine.
    image: pgvector/pgvector:pg18
    container_name: visualize-laws-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: locus
    ports:
      - "5432:5432"
    volumes:
      # PG18 moved PGDATA/VOLUME to /var/lib/postgresql (was .../data).
      - visualize_laws_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d locus"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: visualize-laws-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/locus?schema=public
      DIRECT_URL: postgresql://postgres:postgres@postgres:5432/locus?schema=public
      # Rows the entrypoint seeds on first boot; 0 = the full ~2.2M-row corpus.
      SEED_LIMIT: ${SEED_LIMIT:-25000}
      NODE_ENV: development
      # Reliable file watching / hot reload over a bind mount (macOS/Windows).
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - .:/workspace
      - visualize_laws_node_modules:/workspace/node_modules
      - visualize_laws_next:/workspace/.next
      - visualize_laws_cache:/workspace/.locus-cache

volumes:
  visualize_laws_pgdata:
  visualize_laws_node_modules:
  visualize_laws_next:
  visualize_laws_cache:
