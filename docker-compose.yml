# LOCUS Explorer — full local stack.
#   One command:  docker compose up   (or: pnpm up / pnpm up:build)
#     -> Postgres + the Next.js app (auto-migrate, sample-seed, hot reload) on :3000
#   DB only (for host-run `pnpm dev`):  pnpm db:up  /  pnpm db:down
services:
  postgres:
    image: postgres:16-alpine
    container_name: locus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: locus
    ports:
      - "5432:5432"
    volumes:
      - locus_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d locus"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: locus-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/locus?schema=public
      DIRECT_URL: postgresql://postgres:postgres@postgres:5432/locus?schema=public
      NODE_ENV: development
      # Reliable file watching / hot reload over a bind mount (macOS/Windows).
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - .:/workspace
      - locus_node_modules:/workspace/node_modules
      - locus_next:/workspace/.next
      - locus_cache:/workspace/.locus-cache

volumes:
  locus_pgdata:
  locus_node_modules:
  locus_next:
  locus_cache:
